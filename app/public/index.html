<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raindeer.social — AI Marketing Team</title>
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/css/canvas.css">
<link rel="stylesheet" href="/css/previews.css">
<link rel="stylesheet" href="/css/studio.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail">
    <a class="rail-brand" href="#/setup">
      <img src="/assets/logo-mark.png" alt="" width="28" height="28">
      <span>raindeer<i>.</i>social</span>
    </a>
    <nav class="steps" id="steps"></nav>
    <div class="rail-foot"><i class="dot" id="statusDot"></i><span id="statusText">connecting</span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="rail-toggle" id="railToggle" type="button"
          aria-controls="rail" aria-expanded="true" aria-label="Hide navigation" title="Toggle sidebar (⌘\)">
          <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
            <rect class="pane" x="3" y="4" width="5" height="12" rx="1.5"/>
            <rect x="3" y="4" width="14" height="12" rx="2.5" fill="none"
              stroke="currentColor" stroke-width="1.4"/>
            <line x1="8" y1="4" x2="8" y2="16" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <p class="crumb" id="crumb"></p>
      </div>
      <div class="topbar-right" id="topbarRight"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
